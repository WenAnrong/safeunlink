# safeunlink 配置示例 — 复制到 ~/.config/safeunlink.conf 或 /etc/safeunlink.conf
#
# --- 删除拦截 (库读取) ---
#
# mode: warn  = 提示后继续删除
#       ask   = 交互确认 (终端 y/N; 无终端时 daemon 弹 zenity 图形框)
#       block = 提示并直接拒绝 (返回 EBUSY)
mode = ask

# 豁免进程 (逗号分隔): 这些程序自己删除文件时不检查
exempt_procs = apt,apt-get,dpkg,snap,flatpak

# 豁免路径前缀 (逗号分隔): 这些路径下的删除不检查
exempt_paths =

# 占用快照有效期 (秒): 批量删除时每 N 秒重建一次"谁占用了什么"的扫描结果
# 0 = 每次删除都重新全盘扫描 (最精确, 批量删除时较慢)
ttl = 2

# 回收站拦截: 文件管理器"删除"实际是移入 ~/.local/share/Trash/files,
# 开启后同样先检查占用再处理 (on/off)
trash = on

#
# --- 守护进程 (daemon 读取) ---
#
# dialog: zenity  = 用 zenity 弹询问框 (默认)
#         notify  = 只发 notify-send 通知, 不询问 (无法取消, 直接继续)
#         none    = 不弹窗不通知, 直接放行
dialog = zenity

# log: auto = $XDG_STATE_HOME 或 ~/.local/state/safeunlink/safeunlinkd.log
#      none = 不写日志
#      其他值 = 日志文件路径
log = auto

# socket: auto = $XDG_RUNTIME_DIR/safeunlink.sock (无则 /tmp/safeunlink-<uid>.sock)
#         其他值 = socket 路径 (库与 daemon 需一致)
socket = auto
